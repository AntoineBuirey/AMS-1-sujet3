[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "networker"
version = "0.1.0"
readme = "readme.md"
requires-python = ">=3.12"

dependencies = [
"click==8.3.0",
"contourpy==1.3.3",
"cycler==0.12.1",
"fonttools==4.61.0",
"gamuLogger==3.2.4",
"joblib==1.5.2",
"kiwisolver==1.4.9",
"matplotlib==3.10.7",
"networkx==3.5",
"nltk==3.9.1",
"numpy==2.3.4",
"packaging==25.0",
"pillow==12.0.0",
"pyparsing==3.2.5",
"python-dateutil==2.9.0.post0",
"regex==2025.11.3",
"six==1.17.0",
"spacy>=3.8.11",
"tqdm==4.67.1",
"pandas==2.2.3",
"fr_core_news_sm==3.8.0@https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl"
]
[project.optional-dependencies]
ai = ["google-genai"]
tools = ["pypdf"]

[tool.setuptools]
packages = { find = { exclude = ["temp"] } }
package-data = { "networker" = [
    "data/*",
] }
include-package-data = true

[project.scripts]
networker = "networker.main:main"
verb = "networker.verb:main"
gen_verb = "networker.verb_table_gen:main"